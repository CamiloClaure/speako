openapi: 3.1.0
info:
  title: Speako API
  version: "1.0.0"
  license:
    name: UNLICENSED
    identifier: UNLICENSED
  description: >
    The frozen wire contract between the Speako SPA and the Go API. Hand-written
    to match `api/internal/http/dto/dto.go` (the only package allowed `json:`
    tags) and the routes registered in `api/internal/http/router.go`.

    Money is always integer cents (`*_cents`), never a float or a formatted
    string. Timestamps are RFC3339 UTC strings. Every error response uses the
    envelope `{"error":{"code":"...","message":"..."}}` with `code` drawn from
    a closed 14-value enum - see `ErrorCode` below and
    `docs/decisions/001-contract-freeze.md`.

    Changing this file after the S3 freeze requires its own session touching
    both the API and the SPA - see the decision doc.
servers:
  - url: /
    description: Same-origin. The SPA calls this API from its own domain.

tags:
  - name: public
    description: No session required.
  - name: auth
    description: Session establishment. Sessions arrive as an HttpOnly `speako_session` cookie.
  - name: student
    description: Requires a session belonging to a student.
  - name: booking
    description: Requires a session belonging to a student.
  - name: admin
    description: Requires a session belonging to the teacher or an admin.
  - name: webhooks
    description: Called by Mercado Pago, not by the SPA.

paths:
  /healthz:
    get:
      tags: [public]
      operationId: healthz
      summary: Liveness check.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/products:
    get:
      tags: [public]
      operationId: listProducts
      summary: List active and inactive materials and packs.
      security: []
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/products/{slug}:
    get:
      tags: [public]
      operationId: getProduct
      summary: Fetch one product by its slug.
      security: []
      parameters:
        - $ref: "#/components/parameters/ProductSlug"
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/slots:
    get:
      tags: [public]
      operationId: listSlots
      summary: List bookable lesson windows in a time range.
      description: >
        `from` and `to` are RFC3339 instants; the range is capped server-side.
        `tz` is only used to validate the caller sent an IANA zone - slots
        themselves are always returned as UTC instants and the SPA renders
        them in the caller's zone.
      security: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: tz
          in: query
          required: true
          schema: { type: string, example: "America/Sao_Paulo" }
      responses:
        "200":
          description: Available slots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlotList" }
        "422": { $ref: "#/components/responses/Validation" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/leads:
    post:
      tags: [public]
      operationId: captureLead
      summary: Capture a marketing lead with LGPD consent evidence.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadRequest" }
      responses:
        "201":
          description: Lead captured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "422": { $ref: "#/components/responses/Validation" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/leads/confirm:
    get:
      tags: [public]
      operationId: confirmLead
      summary: Confirm a captured lead via its emailed token (double opt-in).
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lead confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "422": { $ref: "#/components/responses/Validation" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/auth/magic-link:
    post:
      tags: [auth]
      operationId: requestMagicLink
      summary: Request a one-time sign-in link by email.
      description: >
        Always responds 202 whether or not the email has an account, so the
        response cannot be used to enumerate registered users.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagicLinkRequest" }
      responses:
        "202":
          description: The link was sent, if the email exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/auth/magic-link/verify:
    post:
      tags: [auth]
      operationId: verifyMagicLink
      summary: Exchange a magic-link token for a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyMagicLinkRequest" }
      responses:
        "200":
          description: Signed in. The session arrives as a `Set-Cookie` header.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/Validation" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create a student account with a password and sign in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: Account created and signed in. The session arrives as a `Set-Cookie` header.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "409":
          description: The email already has an account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: { code: email_taken, message: "email already registered" } }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with an email and password.
      description: >
        Responds identically - same status, same code, same message - whether
        the email is unknown, the account has no password set, or the
        password is wrong, so the response cannot be used to enumerate
        accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in. The session arrives as a `Set-Cookie` header.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401":
          description: Wrong email or password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: { code: invalid_credentials, message: "invalid email or password" } }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/auth/google:
    post:
      tags: [auth]
      operationId: googleSignIn
      summary: Sign in (or register) with a Google ID token.
      description: >
        Frozen shape - see `docs/decisions/001-contract-freeze.md`. Returns
        `501 not_implemented` while no Google client ID is configured on the
        server.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleSignInRequest" }
      responses:
        "200":
          description: Signed in. The session arrives as a `Set-Cookie` header.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401":
          description: The Google ID token is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: { code: unauthenticated, message: "invalid google token" } }
        "422": { $ref: "#/components/responses/Validation" }
        "501":
          description: No Google client ID is configured on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: { code: not_implemented, message: "google sign-in is not configured" } }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session, if any.
      security: []
      responses:
        "200":
          description: Always 200, even with no session. The cookie is cleared either way.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/me:
    get:
      tags: [student]
      operationId: me
      summary: The signed-in user.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/me/credits:
    get:
      tags: [student]
      operationId: myCredits
      summary: The student's spendable credit balance.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Credit balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credits" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/me/orders:
    get:
      tags: [student]
      operationId: myOrders
      summary: The student's own purchase orders.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/me/materials:
    get:
      tags: [student]
      operationId: myMaterials
      summary: Materials the student has been granted an entitlement to.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Materials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/me/materials/{slug}/download:
    get:
      tags: [student]
      operationId: downloadMaterial
      summary: Issue a redirect to a short-lived download URL for a material.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductSlug"
      responses:
        "302":
          description: Redirect to the signed download URL. No body.
          headers:
            Location:
              schema: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: >
            Not a student, or a student with no entitlement to this material
            (same code as the generic forbidden case - the SPA does not need
            to tell the two apart, it only offers materials the student owns).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: { code: forbidden, message: "no entitlement to this material" } }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/me/bookings:
    get:
      tags: [student]
      operationId: myBookings
      summary: The student's own bookings.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Bookings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/checkout:
    post:
      tags: [student]
      operationId: checkout
      summary: Start a Mercado Pago checkout for a product.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "201":
          description: Order created; redirect the browser to `checkout_url`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
        "502":
          description: Mercado Pago could not create the preference.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: { code: payment_failed, message: "payment provider unavailable" } }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/bookings:
    post:
      tags: [booking]
      operationId: bookLesson
      summary: Spend one credit to book a lesson slot.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingRequest" }
      responses:
        "201":
          description: Booked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >
            Either the slot was just taken by someone else, or the student has
            no credits left - see `code` to tell them apart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                slot_taken:
                  value: { error: { code: slot_taken, message: "slot already booked" } }
                insufficient_credits:
                  value: { error: { code: insufficient_credits, message: "no credits left" } }
        "422":
          description: >
            The request body was malformed, the time is not a real slot on the
            teacher's calendar, or it is too close to the slot's start to book
            (the minimum-notice window) - see `code`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                validation_failed:
                  value: { error: { code: validation_failed, message: "that time is not an available slot" } }
                too_late_to_book:
                  value: { error: { code: too_late_to_book, message: "too close to the slot to book" } }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/bookings/{id}:
    delete:
      tags: [booking]
      operationId: cancelBooking
      summary: Cancel one of the student's own bookings.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Cancelled; the credit is refunded per the cancellation policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Inside the free-cancellation window (default 24h before the lesson).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: { code: too_late_to_cancel, message: "too late to cancel" } }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/webhooks/mercadopago:
    post:
      tags: [webhooks]
      operationId: mercadoPagoWebhook
      summary: Mercado Pago payment notification.
      description: >
        Always acknowledges 200 so the gateway stops retrying. Signature
        verification and payment-status resolution land in a later session
        (S6); today the notification is only logged.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MercadoPagoWebhook" }
      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "422": { $ref: "#/components/responses/Validation" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/admin/availability:
    get:
      tags: [admin]
      operationId: getAvailability
      summary: The teacher's weekly availability rules.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Availability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedError" }
    put:
      tags: [admin]
      operationId: putAvailability
      summary: Replace the teacher's weekly availability rules.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Availability" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/admin/bookings:
    get:
      tags: [admin]
      operationId: adminListBookings
      summary: Every booking in a time range, across all students.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: from
          in: query
          required: false
          description: Defaults to now.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Defaults to `from` + 30 days; the window may not exceed 30 days.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Bookings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBookingList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/admin/bookings/{id}/status:
    post:
      tags: [admin]
      operationId: markAttendance
      summary: Mark a lesson's attendance outcome.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [completed, no_show]
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/admin/bookings/{id}:
    delete:
      tags: [admin]
      operationId: adminCancelBooking
      summary: Cancel a booking as the teacher. Always refunds the credit.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/admin/orders:
    get:
      tags: [admin]
      operationId: adminListOrders
      summary: Every purchase order, across all students.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedError" }

  /api/v1/admin/products:
    post:
      tags: [admin]
      operationId: adminUpsertProduct
      summary: Create or update a material or pack.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProductInput" }
      responses:
        "201":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
        default: { $ref: "#/components/responses/UnexpectedError" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: speako_session
      description: >
        HttpOnly, Secure (in production), SameSite=Lax. Set by every
        successful sign-in endpoint and cleared by logout. Never read by
        client-side JS - the SPA calls `GET /me` to find out who is signed in.

  parameters:
    ProductSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    BookingId:
      name: id
      in: path
      required: true
      schema: { type: string }

  headers:
    SessionCookie:
      description: Sets the `speako_session` HttpOnly cookie.
      schema: { type: string }

  responses:
    Unauthenticated:
      description: No live session was presented.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: unauthenticated, message: "authentication required" } }
    Forbidden:
      description: A live session was presented, but it may not do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: forbidden, message: "esta área é restrita à professora" } }
    NotFound:
      description: No resource at this identifier.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: not_found, message: "not found" } }
    Validation:
      description: The request was malformed or failed a caller-facing invariant.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: validation_failed, message: "invalid request body" } }
    RateLimited:
      description: Too many sign-in attempts from this account or this IP.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: rate_limited, message: "too many attempts, try again later" } }
    UnexpectedError:
      description: >
        Any status/code pair not called out above. In practice almost always
        500 with code `internal` - the server never leaks the underlying
        detail into the body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: internal, message: "internal error" } }

  schemas:
    ErrorCode:
      type: string
      description: >
        Closed set. This enum is character-identical to `errorCode` in
        `api/internal/http/errors.go` - adding, removing or renaming a value
        is a contract change and needs its own session (see
        `docs/decisions/001-contract-freeze.md`).
      enum:
        - unauthenticated
        - forbidden
        - not_found
        - validation_failed
        - insufficient_credits
        - slot_taken
        - too_late_to_book
        - too_late_to_cancel
        - payment_failed
        - rate_limited
        - invalid_credentials
        - email_taken
        - not_implemented
        - internal

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          description: Human-readable detail. Not localized - the SPA maps `code` to pt-BR copy itself.

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }

    Status:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }

    Product:
      type: object
      required: [id, slug, title, kind, price_cents, active]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        kind:
          type: string
          enum: [material, pack]
        price_cents:
          type: integer
          format: int64
          description: BRL, integer cents. Never a float.
        credits:
          type: integer
          description: Only present for kind=pack.
        validity_days:
          type: integer
          description: Only present for kind=pack; absent means the pack never expires.
        active: { type: boolean }

    ProductList:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }

    Slot:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date-time, description: RFC3339 UTC. }
        end: { type: string, format: date-time, description: RFC3339 UTC. }

    SlotList:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          items: { $ref: "#/components/schemas/Slot" }

    User:
      type: object
      required: [id, email, name, role, timezone]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role:
          type: string
          enum: [student, teacher, admin]
        timezone:
          type: string
          description: IANA zone, e.g. "America/Sao_Paulo".

    Credits:
      type: object
      required: [balance, expiring_soon]
      properties:
        balance: { type: integer }
        expiring_soon:
          type: integer
          description: Credits expiring soon enough to warn the student about.
        next_expiry:
          type: string
          format: date-time
          description: RFC3339 UTC. Absent if nothing is expiring.

    Order:
      type: object
      required: [id, status, amount_cents, created_at]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [pending, paid, failed, expired, refunded]
        amount_cents:
          type: integer
          format: int64
        created_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time }
        provider_ref:
          type: string
          description: Mercado Pago's reference for this payment, once it exists.

    OrderList:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/Order" }

    Material:
      type: object
      required: [id, slug, title]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }

    MaterialList:
      type: object
      required: [materials]
      properties:
        materials:
          type: array
          items: { $ref: "#/components/schemas/Material" }

    Booking:
      type: object
      required: [id, status, start, end]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [scheduled, completed, cancelled_by_student, cancelled_by_teacher, no_show]
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }

    BookingList:
      type: object
      required: [bookings]
      properties:
        bookings:
          type: array
          items: { $ref: "#/components/schemas/Booking" }

    LeadRequest:
      type: object
      required: [email, source]
      properties:
        email: { type: string, format: email }
        source:
          type: string
          description: Where the lead came from, e.g. "landing-hero".

    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    VerifyMagicLinkRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        password: { type: string, format: password }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    GoogleSignInRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: The Google-issued ID token (JWT) from the client-side Google sign-in flow.

    CheckoutRequest:
      type: object
      required: [product_slug]
      properties:
        product_slug: { type: string }
        quantity:
          type: integer
          minimum: 1
          default: 1

    CheckoutResponse:
      type: object
      required: [order_id, checkout_url]
      properties:
        order_id: { type: string }
        checkout_url:
          type: string
          format: uri
          description: Mercado Pago Checkout Pro URL to redirect the browser to.

    BookingRequest:
      type: object
      required: [starts_at]
      properties:
        starts_at:
          type: string
          format: date-time
          description: RFC3339 UTC. Must match a currently available slot exactly.

    MercadoPagoWebhook:
      type: object
      description: Only the fields the handler reads; Mercado Pago sends more, and unknown fields are ignored.
      required: [type, action, data]
      properties:
        type: { type: string }
        action: { type: string }
        data:
          type: object
          required: [id]
          properties:
            id: { type: string }

    AvailabilityRule:
      type: object
      description: >
        One weekly window in the teacher's own timezone, as minutes since
        local midnight (never a clock string), so the client cannot smuggle a
        timezone into it.
      required: [weekday, start_min, end_min, slot_min]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0=Sunday .. 6=Saturday.
        start_min: { type: integer, description: Minutes since local midnight. }
        end_min: { type: integer, description: Minutes since local midnight. }
        slot_min: { type: integer, description: Lesson length in minutes. }

    Availability:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityRule" }

    AdminBooking:
      type: object
      required: [id, status, start, end]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [scheduled, completed, cancelled_by_student, cancelled_by_teacher, no_show]
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }

    AdminBookingList:
      type: object
      required: [bookings]
      properties:
        bookings:
          type: array
          items: { $ref: "#/components/schemas/AdminBooking" }

    AdminProductInput:
      type: object
      description: The price arrives as integer cents; converting from reais is the client's job.
      required: [id, slug, title, price_cents, kind, active]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        price_cents: { type: integer, format: int64 }
        kind:
          type: string
          enum: [material, pack]
        file_key:
          type: string
          description: Storage key for a material's file. Only meaningful for kind=material.
        credits:
          type: integer
          description: Only meaningful for kind=pack.
        validity_days:
          type: integer
          description: Only meaningful for kind=pack; 0 means it never expires.
        active: { type: boolean }
